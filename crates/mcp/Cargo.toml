[package]
name = "vectorcraft-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VectorCraft MCP server: JSON-RPC 2.0 over stdio, driving a running app or a headless session"

[lints]
workspace = true

[features]
# Local transport prototype; excluded from ordinary builds and from wasm.
http = ["dep:tiny_http", "dep:subtle"]

[dependencies]
vectorcraft-engine = { workspace = true }
vectorcraft-render = { workspace = true }
vectorcraft-svg = { workspace = true }
vectorcraft-format = { workspace = true }
vectorcraft-tools = { workspace = true }
vectorcraft-geom = { workspace = true }
vectorcraft-doc = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

image = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tiny_http = { version = "0.12", default-features = false, optional = true }
subtle = { version = "2.6", optional = true }

[dev-dependencies]
tempfile = "3"
vectorcraft-testkit = { workspace = true }
proptest = { workspace = true }
socket2 = { workspace = true }
